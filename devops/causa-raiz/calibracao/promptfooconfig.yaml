# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Harness de CALIBRACAO do juiz de `causa-raiz`.
#
# Esta suite nao avalia o prompt. Ela avalia o JUIZ.
#
# A entrada nao vem de modelo: vem de dois arquivos com saidas ja registradas no
# Checkpoint 03, que tem nota humana atribuida antes de existir juiz automatizado.
# Rodar a rubrica contra um modelo de verdade misturaria duas variacoes diferentes
# ("o modelo escreveu pior" e "o juiz pontuou diferente"), e o resultado nao permitiria
# concluir nada sobre nenhuma das duas.
#
# A rubrica NAO e escrita aqui. Os quatro criterios e a instrucao do juiz vivem em
# `../criterios/`, e sao os MESMOS arquivos usados pelo gate de verdade em
# `../promptfooconfig.yaml`. Se a rubrica morasse nos dois configs, calibrar um juiz
# contra um texto e usar outro em producao seria questao de tempo — e o Checkpoint 08
# ja produziu um caso desses, com o prompt e a suite divergindo em silencio.
#
# Rodar da raiz do repositorio:
#   npx promptfoo eval -c devops/causa-raiz/calibracao/promptfooconfig.yaml --no-cache \
#     -o /tmp/calibracao.json
#   node devops/causa-raiz/calibracao/calibrar.js /tmp/calibracao.json
#
# Para comparar juizes sem editar arquivo:  --grader openai:gpt-4o

description: Calibracao do juiz da rubrica de causa-raiz contra pontuacao humana

evaluateOptions:
  # Sequencial porque o juiz e chamado 4 vezes por caso, e limite por minuto do provedor
  # se aplica a chamada de julgamento igual a qualquer outra.
  maxConcurrency: 1

prompts:
  # O prompt e irrelevante aqui: o provider de replay ignora o texto e devolve o arquivo.
  # Precisa existir porque o promptfoo exige ao menos um prompt declarado.
  - id: '{{execucao}}'
    label: replay

providers:
  - id: file://replay.js
    label: saida-registrada

defaultTest:
  options:
    # O JUIZ VAI DECLARADO, e isso nao e preferencia de estilo.
    #
    # Sem `provider` explicito, o promptfoo 0.123.1 calcula
    # `shouldPreferRemote = ... || !grading.provider`, o que abre caminho para a
    # avaliacao ser feita pelo servico remoto da ferramenta. O insumo deste item e log e
    # metrica de producao: mandar a saida para endpoint de terceiro nao e decisao que um
    # arquivo de teste deve tomar em silencio.
    #
    # Modelo escolhido: `gemini-3.5-flash` com raciocinio ligado. Escolhido por medicao
    # neste harness, e nao por inferencia — tres candidatos rodaram contra a mesma
    # referencia humana:
    #
    #   gemini-3.5-flash  8 de 8 notas iguais a humana, reproduz as duas discriminacoes
    #                     -> CALIBRADO
    #   gpt-4o            7 de 8 notas iguais; nao distingue as duas execucoes no
    #                     critério 3, porque repete a leitura leniente que o humano
    #                     tinha feito -> nao calibrado
    #   gpt-4o-mini       4 de 8; atribuiu 1 ponto a TODOS os critérios das duas
    #                     execucoes, nao distingue nada e inverte a decisao de corte
    #                     -> nao calibrado
    #
    # O gpt-4o-mini e o caso que mais ensina: nota uniforme no meio da escala parece
    # julgamento e nao carrega informacao nenhuma. Ele reprovaria as duas analises,
    # inclusive a que o humano deu 8 de 8.
    #
    # Custa mais caro e demora o dobro do gpt-4o (18.860 tokens contra 12.487, 32s contra
    # 15s, cerca de US$0,076 contra US$0,039 para julgar duas analises). O gasto se
    # justifica porque este item roda durante investigacao de incidente, e nao em caminho
    # quente, e porque juiz que nao distingue analise boa de analise mediana transforma o
    # gate em enfeite.
    provider:
      id: google:gemini-3.5-flash
      config:
        temperature: 0
        generationConfig:
          thinkingConfig:
            # Aqui o raciocinio FICA LIGADO, ao contrario das suites do Checkpoint 08.
            # Nao existe limite de latencia nesta suite, e julgar honestidade epistemica
            # exige comparar afirmacao contra evidencia disponivel — e cadeia, nao lookup.
            thinkingBudget: 2048

    # A escala da rubrica e 0, 1 ou 2 por critério; o promptfoo trabalha com score
    # continuo de 0 a 1. A conversao e a exigencia de nota DISCRETA estao na instrucao,
    # que e compartilhada com o gate.
    rubricPrompt: file://../criterios/instrucao-do-juiz.txt

  assert:
    - type: llm-rubric
      metric: c1-causa-raiz
      threshold: 0.5
      value: file://../criterios/c1-causa-raiz.txt

    - type: llm-rubric
      metric: c2-correlacao-vs-causa
      threshold: 0.5
      value: file://../criterios/c2-correlacao-vs-causa.txt

    - type: llm-rubric
      metric: c3-acao-proporcional
      threshold: 0.5
      value: file://../criterios/c3-acao-proporcional.txt

    - type: llm-rubric
      metric: c4-honestidade-epistemica
      threshold: 0.5
      value: file://../criterios/c4-honestidade-epistemica.txt

# As notas humanas NAO ficam aqui. Elas vivem em `referencia-humana.json`, que e a fonte
# unica lida por `calibrar.js`.
#
# Dois motivos. O primeiro e que a comparacao que qualifica um juiz e RELATIVA e cruza os
# dois casos — ele tem que dar nota menor a execucao 1 nos critérios 3 e 4 — e um assert
# do promptfoo so ve o proprio caso. O segundo apareceu na pratica: uma nota humana foi
# corrigida depois de o juiz ja ter sido executado, e com a referencia num arquivo
# separado deu para reavaliar a concordancia sem gastar chamada de API de novo.
tests:
  - description: Execucao 1 do CP03 — referencia humana 6/8 (c3 = 1, c4 = 1)
    vars:
      execucao: execucao-1.txt

  - description: Execucao 2 do CP03 — referencia humana 8/8
    vars:
      execucao: execucao-2.txt
